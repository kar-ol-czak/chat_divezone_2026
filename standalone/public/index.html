<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DiveZone</title>
<style>
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1a1f23;
    background: #f3f5f6;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .box {
    max-width: 360px;
    text-align: center;
    background: #fff;
    padding: 28px 22px;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(15, 25, 35, 0.05), 0 2px 8px rgba(15, 25, 35, 0.04);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #1e6363;
  }
  p {
    margin: 0;
    color: #5f6c75;
  }
</style>
</head>
<body>
<div class="box">
  <h1>DiveZone</h1>
  <p>Brak dostępu publicznego.</p>
</div>
</body>
</html>
